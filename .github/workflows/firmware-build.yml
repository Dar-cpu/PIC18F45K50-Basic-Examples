name: Build PIC18F45K50 firmware

on:
  push:
    paths:
      - "bootloader/**"
      - "application/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "bootloader/**"
      - "application/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install XC8
        uses: usimd/setup-xc-action@v1
        with:
          compiler: xc8
          version: "3.10"

      - name: Install PIC18F-K device pack
        run: |
          curl --fail --location \
            --output "$RUNNER_TEMP/PIC18F-K_DFP.atpack" \
            https://packs.download.microchip.com/Microchip.PIC18F-K_DFP.1.17.312.atpack
          mkdir -p "$RUNNER_TEMP/PIC18F-K_DFP"
          unzip -q "$RUNNER_TEMP/PIC18F-K_DFP.atpack" \
            -d "$RUNNER_TEMP/PIC18F-K_DFP"
          echo "DFP_DIR=$RUNNER_TEMP/PIC18F-K_DFP/xc8" >> "$GITHUB_ENV"

      - name: Unit tests
        run: make test

      - name: Measure unrestricted bootloader image
        run: make bootloader BOOT_RESERVE=

      - name: Upload measurement
        uses: actions/upload-artifact@v4
        with:
          name: TECKIO-PIC18F45K50-firmware
          path: |
            dist/*.hex
            build/*.map
