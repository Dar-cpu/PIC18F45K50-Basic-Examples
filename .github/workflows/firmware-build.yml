name: Build PIC18F45K50 firmware

on:
  push:
    paths:
      - "bootloader/**"
      - "application/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "bootloader/**"
      - "application/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install XC8
        uses: usimd/setup-xc-action@v1
        with:
          compiler: xc8
          version: "3.10"

      - name: Unit tests
        run: make test

      - name: Build bootloader, application and factory image
        run: make all

      - name: Verify generated address ranges
        run: |
          python3 tools/make_factory_hex.py \
            --bootloader dist/TECKIO_bootloader.hex \
            --application dist/Aplicacion_TECKIO.hex \
            --output dist/TECKIO_factory_verified.hex
          cmp dist/TECKIO_factory.hex dist/TECKIO_factory_verified.hex

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TECKIO-PIC18F45K50-firmware
          path: |
            dist/*.hex
            build/*.map
